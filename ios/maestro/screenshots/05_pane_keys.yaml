appId: com.enchantinglabs.herdrcat
---
# Frame 05: Swipeable Live terminal key strip.
- launchApp:
    clearState: true
    arguments:
      hc.autoconnect: "1"
      hc.host: "127.0.0.1"
      hc.port: "@HC_SSH_PORT@"
      hc.user: "@HC_SSH_USER@"
      hc.key: "@HC_SSH_KEY_PATH@"
      hc.tab: "spaces"

- extendedWaitUntil:
    visible: "Verify Host Key"
    timeout: 30000
- tapOn: "Trust and Connect"

- extendedWaitUntil:
    visible:
      id: "machine-picker"
    timeout: 45000

- extendedWaitUntil:
    visible:
      id: "space-row-1"
    timeout: 45000

- tapOn:
    id: "space-row-1"

- extendedWaitUntil:
    visible:
      id: "pane-live-key-strip"
    timeout: 45000

- swipe:
    start: 70%, 92%
    end: 25%, 92%
    duration: 450

- waitForAnimationToEnd:
    timeout: 2000

- takeScreenshot: "05_pane_keys"
