name: Herdcats
options:
  bundleIdPrefix: com.enchantinglabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  SWIFT_VERSION: "5.10"
  CODE_SIGN_STYLE: Automatic

packages:
  Citadel:
    path: ThirdParty/Citadel

targets:
  Herdcats:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Herdcats
    dependencies:
      - package: Citadel
        product: Citadel
    info:
      path: Herdcats/Info.plist
      properties:
        CFBundleDisplayName: Herdcats
        CFBundleShortVersionString: "0.3.1"
        CFBundleVersion: "84"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchCat
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Use the microphone to dictate pane messages.
        NSSpeechRecognitionUsageDescription: Transcribe your speech into pane messages using Apple speech recognition.
        NSPhotoLibraryUsageDescription: Choose photos to send into Herdr panes.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enchantinglabs.herdrcat
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""

  HerdcatsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HerdcatsTests
    dependencies:
      - target: Herdcats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enchantinglabs.herdrcat.tests
        GENERATE_INFOPLIST_FILE: YES

  HerdcatsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HerdcatsUITests
    dependencies:
      - target: Herdcats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enchantinglabs.herdrcat.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Herdcats

schemes:
  Herdcats:
    build:
      targets:
        Herdcats: all
        HerdcatsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HerdcatsTests
        - HerdcatsUITests
