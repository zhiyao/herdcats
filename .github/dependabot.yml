version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /ios/app-store-images
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: bundler
    directory: /ios
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # XcodeGen owns the dependency declarations. Before merging a Swift update,
  # apply its version changes to ios/project.yml and regenerate the project.
  - package-ecosystem: swift
    directory: /ios
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
