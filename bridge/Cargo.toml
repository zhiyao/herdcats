[package]
name = "herdcats-bridge"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "preserve_order"] }
libc = "=0.2.191"
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse", "display"] }
